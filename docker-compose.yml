services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: revision
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  auth:
    build: ./auth
    environment:
      DATABASE_URL: mysql+pymysql://app:${DB_PASSWORD}@db:3306/revision?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET}
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  study:
    build: ./study
    environment:
      DATABASE_URL: mysql+pymysql://app:${DB_PASSWORD}@db:3306/revision?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET}
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  gateway:
    build: .
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - caddy_data:/data
    depends_on: [auth, study]
    restart: unless-stopped
volumes:
  mysql_data:
  caddy_data:
