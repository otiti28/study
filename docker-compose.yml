services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: revision
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d revision"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  auth:
    build: ./auth
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@db/revision
      JWT_SECRET: ${JWT_SECRET}
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  study:
    build: ./study
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@db/revision
      JWT_SECRET: ${JWT_SECRET}
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  gateway:
    build: .
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - caddy_data:/data
    depends_on: [auth, study]
    restart: unless-stopped
volumes:
  pgdata:
  caddy_data:
