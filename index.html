<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emploi du temps · CSIA 3 · ESATIC</title>
<style>
:root{--navy:#131921;--navy2:#232f3e;--or:#ff9900;--jaune:#ffd814;--bg:#eaeded;--txt:#0f1111;--lien:#007185;--gris:#565959}
*{box-sizing:border-box;margin:0}
body{font:14px/1.4 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:8px 14px;flex-wrap:wrap}
.logo{font-size:22px;font-weight:700;padding:4px 8px}
.logo span{color:var(--or)}
.logo i{display:block;height:3px;border-radius:0 0 40px 40px;background:var(--or);margin-top:-2px}
.hx{font-size:12px;color:#ccc;padding:4px 8px;border:1px solid transparent;border-radius:2px}
.hx b{display:block;color:#fff;font-size:14px}
.hx:hover{border-color:#fff}
.search{flex:1;min-width:230px;display:flex;height:40px;border-radius:4px;overflow:hidden}
.search select{background:#e6e6e6;border:0;border-right:1px solid #cdcdcd;padding:0 8px;font-size:12px;color:#555;max-width:130px}
.search input{flex:1;min-width:0;border:0;padding:0 12px;font-size:15px;outline:0}
.search button{width:46px;border:0;background:#febd69;font-size:17px;cursor:pointer}
.search button:hover{background:#f3a847}
nav{background:var(--navy2);display:flex;gap:4px;padding:0 10px;overflow-x:auto;white-space:nowrap}
nav a{color:#fff;padding:8px 10px;cursor:pointer;border:1px solid transparent;border-radius:2px}
nav a:hover{border-color:#fff}
.hero{background:linear-gradient(180deg,#37475a 0%,#4b6178 55%,var(--bg) 100%);color:#fff;padding:22px 18px 96px}
.hero h2{font-size:26px;font-weight:400;text-transform:capitalize}
.hero p{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.hero p span{background:rgba(255,255,255,.16);border-radius:4px;padding:5px 10px}
.wrap{max-width:1300px;margin:-70px auto 0;padding:0 12px 24px}
.box{background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 2px 5px rgba(15,17,17,.15)}
.box h3{font-size:21px;font-weight:700}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px}
.pills button{border:1px solid #d5d9d9;background:#fff;border-radius:20px;padding:5px 13px;cursor:pointer;font-size:13px}
.pills button:hover{background:#f7fafa}
.pills button.on{background:#fcf5ee;border-color:var(--or);box-shadow:0 0 0 2px #fbe3c5;font-weight:700}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:4px;min-width:700px}
th{font-size:12px;color:var(--gris);text-align:center;padding:4px}
th small{display:block;font-weight:400}
th.rh{white-space:nowrap;width:96px}
th.today{color:#c45500;border-bottom:3px solid var(--or)}
td{height:60px;padding:0}
td.e{background:#f4f6f6;border-radius:6px}
.ev{width:100%;height:100%;min-height:56px;border:0;border-radius:6px;padding:6px;font-size:12px;font-weight:700;text-align:center}
.ev.c{cursor:pointer}
.ev.c:hover{filter:brightness(.92)}
.ev:focus-visible,.btn:focus-visible,.pills button:focus-visible{outline:3px solid #007185;outline-offset:2px}
.ev small{display:block;font-weight:400;font-size:11px}
.exam{background:#b30000;color:#fff;border-radius:6px;padding:40px 16px;text-align:center;font-size:20px;font-weight:700}
.main{display:grid;grid-template-columns:230px 1fr;gap:16px;margin-top:16px}
aside .box{padding:12px 14px}
aside h4{font-size:15px;margin:10px 0 6px}
aside h4:first-child{margin-top:0}
aside label{display:flex;gap:6px;align-items:flex-start;padding:3px 0;cursor:pointer;font-size:13px}
aside a{color:var(--lien);cursor:pointer;font-size:13px}
.bar1{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px}
.bar1 select{padding:5px 8px;border:1px solid #d5d9d9;border-radius:8px;background:#f0f2f2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.card{background:#fff;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(15,17,17,.18)}
.band{height:84px;display:flex;align-items:flex-end;padding:8px 12px;font-weight:700;font-size:20px}
.cb{padding:12px;display:flex;flex-direction:column;gap:5px;flex:1}
.cb h3{font-size:16px;line-height:1.25;font-weight:400}
.by{color:var(--gris);font-size:12px}
.by a{color:var(--lien)}
.price{font-size:28px;line-height:1}
.price sup,.price small{font-size:13px;vertical-align:baseline}
.sub{color:var(--gris);font-size:12px}
.nx{font-size:13px}
.badge{align-self:flex-start;background:#cc0c39;color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px}
.btn{margin-top:auto;border:0;background:var(--jaune);border-radius:20px;padding:8px 12px;font-size:13px;cursor:pointer}
.btn:hover{background:#f7ca00}
.none{padding:30px;text-align:center;color:var(--gris)}
.ov{position:fixed;inset:0;background:rgba(15,17,17,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.ov.show{display:flex}
.md{background:#fff;border-radius:8px;max-width:520px;width:100%;max-height:86vh;overflow:auto}
.mh{padding:16px 18px;position:relative}
.mh h2{font-size:22px;margin:2px 0}
.x{position:absolute;right:10px;top:10px;border:0;background:rgba(255,255,255,.55);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:15px}
.mb{padding:14px 18px 18px}
.bar{height:8px;background:#e3e6e6;border-radius:4px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:#067d62}
.mb ul{list-style:none;padding:0;margin-top:10px}
.mb li{display:flex;gap:10px;padding:8px 4px;border-bottom:1px solid #e7e7e7}
.mb li span{margin-left:auto;color:var(--gris)}
.mb li.d{color:#8d9096;text-decoration:line-through}
.mb li.t{background:#fff3e0;font-weight:700}
footer{background:var(--navy2);color:#ddd;text-align:center;padding:18px;font-size:12px}
footer a{display:block;background:#37475a;color:#fff;padding:12px;margin:-18px -18px 14px;cursor:pointer;font-size:13px}
@media(max-width:800px){.main{grid-template-columns:1fr}.hero h2{font-size:21px}}
@media(prefers-reduced-motion:no-preference){.card,.ev{transition:filter .15s,box-shadow .15s}.card:hover{box-shadow:0 4px 12px rgba(15,17,17,.28)}}
</style>
</head>
<body>
<header>
  <div class="logo">esatic<span>.edt</span><i></i></div>
  <div class="hx">Semestre 5<b>CSIA 3</b></div>
  <div class="search">
    <select id="cat" aria-label="Catégorie" onchange="cat=this.value;cards()">
      <option value="">Toutes</option><option value="INF">Informatique</option>
      <option value="MTH">Mathématiques</option><option value="MAN|MLA">Anglais &amp; Entrepreneuriat</option>
    </select>
    <input id="q" placeholder="Rechercher une matière, un code, un enseignant" aria-label="Recherche" oninput="q=this.value;cards()">
    <button aria-label="Rechercher" onclick="go('ue')">&#128269;</button>
  </div>
  <div class="hx">Examens<b id="cd"></b></div>
</header>
<nav>
  <a onclick="wk=cw();plan();go('plan')">Aujourd'hui</a>
  <a onclick="go('plan')">Planning de la semaine</a>
  <a onclick="go('ue')">Unités d'enseignement</a>
  <a onclick="wk=7;plan();go('plan')">Examens</a>
</nav>
<div class="hero"><h2 id="hd"></h2><p id="hp"></p></div>
<div class="wrap">
  <section class="box" id="plan">
    <h3>Planning de la semaine</h3>
    <div class="pills" id="pills"></div>
    <div class="tw" id="tw"></div>
  </section>
  <div class="main" id="ue">
    <aside>
      <div class="box">
        <h4>Enseignant</h4><div id="ft"></div>
        <h4>Jour de cours</h4><div id="fd"></div>
        <h4></h4><a onclick="reset()">Effacer les filtres</a>
      </div>
    </aside>
    <section>
      <div class="box bar1"><span id="cnt"></span>
        <label>Trier par&nbsp;<select onchange="so=this.value;cards()">
          <option value="rel">Pertinence</option><option value="next">Prochain cours</option>
          <option value="h">Volume horaire</option><option value="az">Nom (A-Z)</option>
        </select></label>
      </div>
      <div class="grid" id="grid"></div>
    </section>
  </div>
</div>
<div class="ov" id="ov" onclick="if(event.target===this)cl()"><div class="md" id="mc" role="dialog" aria-modal="true"></div></div>
<footer><a onclick="scrollTo({top:0,behavior:'smooth'})">Retour en haut</a>ESATIC · Année scolaire 2026-2027 · Semestre 5 CSIA 3 · Partie 1</footer>
<script>
const r=(c,n)=>Array(n).fill(c),R='RATT',$=i=>document.getElementById(i);
const C={
'1MLA3540':{t:'Anglais',p:'SORO Anne-Marie Epse KONAN',h:[8,10,0],c:'#22dd22',f:'#000'},
'1MAN3540':{t:'Entrepreneuriat',p:'M. SILUE Yacouba',h:[14,10,0],c:'#f7a8f7',f:'#000'},
'2MTH3400':{t:'Graphes et applications',p:'Dr DJANAN ATTOUNGBRE Franck',h:[10,14,0],c:'#996600',f:'#fff'},
'1INF3400':{t:'Structures de données complexes et Python',p:'Dr KOFFI DAGOU Dangui Augustin',h:[12,12,0],c:'#1de9a0',f:'#000'},
'1MTH3400':{t:'Optimisation linéaire',p:'Dr KONE Mamadou Ibrahima',h:[10,14,0],c:'#0aa5e8',f:'#fff'},
'2INF3400':{t:'Python pour la Science des données',p:"Dr DOUHA N'GUESSAN",h:[12,12,0],c:'#d3e6ef',f:'#000'},
'1INF3543':{t:'Cloud computing et IoT',p:"Dr N'GORAN Kouadio Rodrigue",h:[6,0,12],c:'#fcd5a6',f:'#000'},
'1INF3542':{t:'Logiciels scientifiques (R, LaTeX, Scilab…)',p:"Dr DOUHA N'GUESSAN",h:[12,12,0],c:'#ffee00',f:'#000'}
};
const X={SPORT:{t:'Sport',c:'#e8e8dc',f:'#c00'},COACHING:{t:'Coaching',c:'#9db4d6',f:'#c00'},APP3:{t:'APP 3',c:'#4ff0f0',f:'#000'},RATT:{t:'Devoirs et cours de rattrapage',c:'#ff6b9d',f:'#fff'}};
const I=c=>C[c]||X[c];
const D=['Lun','Mar','Mer','Jeu','Ven','Sam'];
const H=['7h30 – 10h00','10h15 – 12h45','14h30 – 17h00'];
/* P[jour][créneau][semaine 1..7] */
const P=[
[r('1INF3542',5),r('1MLA3540',7),['SPORT','SPORT','COACHING','SPORT','SPORT','COACHING','SPORT']],
[r('1INF3543',7),r('1INF3400',5),[...r('1MAN3540',4),...r('APP3',3)]],
[r('1INF3542',5),r('2MTH3400',5),[]],
[r('2INF3400',7),r('1MAN3540',6),[...r('2INF3400',3),...r('1MTH3400',4)]],
[r('1MTH3400',6),r('1INF3400',5),r('2MTH3400',5)],
[['','',R,R,R,R,R],[],[]]
];
const W0=new Date(2026,7,31),E=new Date(2026,9,19);
const dt=(w,d)=>new Date(2026,7,31+7*w+d);
const fd=(t,l)=>t.toLocaleDateString('fr-FR',l?{weekday:'long',day:'numeric',month:'long'}:{day:'2-digit',month:'2-digit'});
const tm=(d,s)=>d==5?'8h – 12h':H[s];
const n0=new Date(),td=new Date(n0.getFullYear(),n0.getMonth(),n0.getDate());
function cw(){return Math.max(0,Math.min(7,Math.floor((td-W0+36e5)/6048e5)))}
const ses=k=>{const a=[];P.forEach((day,d)=>day.forEach((sl,s)=>sl.forEach((c,w)=>{if(c===k)a.push({w,d,s,date:dt(w,d)})})));return a.sort((a,b)=>a.date-b.date||a.s-b.s)};
const nxt=k=>ses(k).find(x=>x.date>=td);
let wk=cw(),q='',cat='',tch='',dys=new Set(),so='rel';

function hero(){
  const w=Math.floor((td-W0+36e5)/6048e5),d=(td.getDay()+6)%7,l=[];
  if(w>=0&&w<7&&d<6)P[d].forEach((sl,s)=>{const c=sl[w];if(c)l.push(tm(d,s)+' : '+I(c).t)});
  $('hd').textContent=fd(td,1);
  $('hp').innerHTML=(w==7&&d<6)?'<span>Semaine d\'examens (première partie)</span>':l.length?l.map(x=>'<span>'+x+'</span>').join(''):'<span>Pas de cours aujourd\'hui</span>';
  const n=Math.round((E-td)/864e5);
  $('cd').textContent=n>0?'dans '+n+' jour'+(n>1?'s':''):'à partir du 19/10';
}
function plan(){
  $('pills').innerHTML=Array.from({length:8},(_,i)=>'<button class="'+(i==wk?'on':'')+'" onclick="wk='+i+';plan()">'+(i==7?'Examens':'Semaine '+(i+1))+'</button>').join('');
  if(wk==7){$('tw').innerHTML='<div class="exam">EXAMENS PREMIÈRE PARTIE · SEMESTRES IMPAIRS<br><small>Semaine du 19/10/2026</small></div>';return}
  let h='<table><tr><th></th>'+D.map((d,i)=>{const t=dt(wk,i);return '<th class="'+(+t==+td?'today':'')+'">'+d+'<small>'+fd(t)+'</small></th>'}).join('')+'</tr>';
  for(let s=0;s<3;s++){
    h+='<tr><th class="rh">'+H[s]+'</th>';
    for(let d=0;d<6;d++){
      if(d==5&&s>0)continue;
      const c=P[d][s][wk],sp=d==5?' rowspan="3"':'';
      if(!c){h+='<td class="e"'+sp+'></td>';continue}
      const o=I(c),cl=C[c];
      h+='<td'+sp+'><button class="ev'+(cl?' c':'')+'" style="background:'+o.c+';color:'+o.f+'"'+(cl?' onclick="openC(\''+c+'\')"':'')+'>'+(cl?c+'<small>'+o.t+'</small>':o.t)+(d==5?'<small>8h – 12h</small>':'')+'</button></td>';
    }
    h+='</tr>';
  }
  $('tw').innerHTML=h+'</table>';
}
function cards(){
  const rg=cat?new RegExp(cat):null;
  let L=Object.keys(C).filter(k=>{const o=C[k];return (k+' '+o.t+' '+o.p).toLowerCase().includes(q.toLowerCase())&&(!rg||rg.test(k.slice(1,4)))&&(!tch||o.p===tch)&&(!dys.size||ses(k).some(x=>dys.has(x.d)))});
  const tot=k=>C[k].h[0]+C[k].h[1]+C[k].h[2];
  if(so=='h')L.sort((a,b)=>tot(b)-tot(a));
  if(so=='az')L.sort((a,b)=>C[a].t.localeCompare(C[b].t,'fr'));
  if(so=='next')L.sort((a,b)=>((nxt(a)||{date:9e15}).date-(nxt(b)||{date:9e15}).date));
  $('cnt').textContent=L.length+' unité'+(L.length>1?'s':'')+' d\'enseignement';
  $('grid').innerHTML=L.length?L.map(k=>{
    const o=C[k],n=nxt(k);
    const b=!n?'<span class="badge" style="background:#565959">Terminé</span>':+n.date==+td?'<span class="badge">Aujourd\'hui</span>':'';
    return '<article class="card"><div class="band" style="background:'+o.c+';color:'+o.f+'">'+k+'</div><div class="cb">'+b+
    '<h3>'+o.t+'</h3><p class="by">par <a>'+o.p+'</a></p>'+
    '<div class="price">'+tot(k)+'<small> h</small></div><p class="sub">CM '+o.h[0]+' h · TD '+o.h[1]+' h · TP '+o.h[2]+' h</p>'+
    '<p class="nx">'+(n?'Prochain cours : <b>'+fd(n.date,1)+'</b>, '+tm(n.d,n.s):'Cours terminés')+'</p>'+
    '<button class="btn" onclick="openC(\''+k+'\')">Voir les séances</button></div></article>'}).join('')
  :'<div class="box none">Aucune unité ne correspond à votre recherche. Effacez les filtres pour tout afficher.</div>';
}
function openC(k){
  const o=C[k],a=ses(k),n=a.filter(x=>x.date<td).length;
  $('mc').innerHTML='<div class="mh" style="background:'+o.c+';color:'+o.f+'"><button class="x" onclick="cl()" aria-label="Fermer">✕</button><small>'+k+'</small><h2>'+o.t+'</h2><p>'+o.p+'</p></div><div class="mb"><div class="bar"><i style="width:'+(n/a.length*100)+'%"></i></div><p class="sub">'+n+' séance'+(n>1?'s':'')+' passée'+(n>1?'s':'')+' sur '+a.length+' · CM '+o.h[0]+' h, TD '+o.h[1]+' h, TP '+o.h[2]+' h</p><ul>'+
  a.map(x=>'<li class="'+(x.date<td?'d':+x.date==+td?'t':'')+'"><b>S'+(x.w+1)+'</b>'+fd(x.date,1)+'<span>'+tm(x.d,x.s)+'</span></li>').join('')+'</ul></div>';
  $('ov').classList.add('show');
}
function cl(){$('ov').classList.remove('show')}
function go(i){$(i).scrollIntoView({behavior:'smooth',block:'start'})}
function filt(){
  const T=[...new Set(Object.values(C).map(o=>o.p))];
  $('ft').innerHTML='<label><input type="radio" name="t" checked onchange="tch=\'\';cards()">Tous</label>'+T.map(p=>'<label><input type="radio" name="t" onchange="tch=this.dataset.p;cards()" data-p="'+p.replace(/"/g,'&quot;')+'">'+p+'</label>').join('');
  $('fd').innerHTML=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'].map((d,i)=>'<label><input type="checkbox" onchange="this.checked?dys.add('+i+'):dys.delete('+i+');cards()">'+d+'</label>').join('');
}
function reset(){q='';cat='';tch='';dys.clear();so='rel';$('q').value='';$('cat').value='';filt();cards()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cl()});
hero();plan();filt();cards();
</script>
</body>
</html>
