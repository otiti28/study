<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fiches · Révision</title>
  <style>
    :root {
      --ink: #14213d;
      --bg: #f4f7fb;
      --card: #fff;
      --hl: #ffd60a;
      --mut: #5b6679;
      --line: #d9e0ea;
      --ok: #1a7f4b;
      --ko: #b3261e
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --ink: #e8edf6;
        --bg: #0f1624;
        --card: #18223a;
        --mut: #9aa7bd;
        --line: #2a3652;
        --ok: #4cc38a;
        --ko: #ff8a80
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 16px
    }

    h1 {
      font-size: 1.4rem;
      margin: 0;
      background: linear-gradient(transparent 60%, var(--hl) 60%);
      display: inline-block
    }

    h2 {
      font-size: 1.15rem;
      margin: 20px 0 8px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      margin: 10px 0
    }

    input,
    textarea {
      width: 100%;
      padding: 10px;
      margin: 4px 0 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font: inherit
    }

    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--ink);
      color: var(--bg);
      font: inherit;
      font-weight: 600;
      cursor: pointer
    }

    button.sec {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line)
    }

    button.ok {
      background: var(--ok);
      color: #fff
    }

    button.ko {
      background: var(--ko);
      color: #fff
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid var(--hl);
      outline-offset: 1px
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center
    }

    .row>* {
      flex: 1
    }

    .row .fit {
      flex: none
    }

    .mut {
      color: var(--mut);
      font-size: .9rem
    }

    .err {
      color: var(--ko);
      min-height: 1.4em
    }

    .big {
      font-size: 1.3rem;
      text-align: center;
      padding: 28px 8px;
      min-height: 120px;
      white-space: pre-wrap
    }

    .stat {
      font-size: 1.8rem;
      font-weight: 700
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    a.link {
      cursor: pointer;
      font-weight: 600
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Fiches</h1><span id="who" class="mut"></span>
    </header>
    <div id="v"></div>
  </main>
  <script>
    const $ = s => document.querySelector(s), V = $('#v');
    const esc = t => String(t).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    let token = localStorage.getItem('t'), email = localStorage.getItem('e');
    async function api(p, m = 'GET', b) {
      const r = await fetch('/api' + p, {method: m, headers: {'Content-Type': 'application/json', ...(token ? {Authorization: 'Bearer ' + token} : {})}, body: b ? JSON.stringify(b) : undefined});
      if (r.status == 401 && token && !p.startsWith('/auth')) {logout(); throw new Error('Session expirée')}
      const d = r.status == 204 ? null : await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(typeof d.detail == 'string' ? d.detail : 'Erreur, vérifiez les champs');
      return d
    }
    function logout() {token = null; localStorage.clear(); authView()}
    function head() {$('#who').innerHTML = token ? `${esc(email)} · <a class="link" onclick="logout()">Quitter</a>` : ''}

    function authView() {
      head(); V.innerHTML = `<div class="card"><h2 style="margin-top:0">Révisez un peu, chaque jour</h2>
<input id="em" type="email" placeholder="E-mail" autocomplete="email">
<input id="pw" type="password" placeholder="Mot de passe (8 caractères min.)" autocomplete="current-password">
<p id="er" class="err"></p><div class="row"><button onclick="auth('login')">Se connecter</button><button class="sec" onclick="auth('register')">Créer un compte</button></div></div>`}
    async function auth(k) {
      try {
        const d = await api('/auth/' + k, 'POST', {email: $('#em').value, password: $('#pw').value});
        token = d.token; email = d.email; localStorage.setItem('t', token); localStorage.setItem('e', email); decks()
      } catch (e) {$('#er').textContent = e.message}
    }

    async function decks() {
      head(); const [ds, st] = await Promise.all([api('/decks'), api('/stats')]);
      V.innerHTML = `<div class="grid"><div class="card"><div class="stat">${st.reviews_today}</div><span class="mut">révisées aujourd'hui</span></div>
  <div class="card"><div class="stat">${st.streak_days} j</div><span class="mut">de suite</span></div></div>
  <a class="link" onclick="statsView()">Voir mes statistiques</a>
  <h2>Mes paquets</h2>
  <div class="row"><input id="dn" placeholder="Nouveau paquet (ex. Anatomie)" style="margin:0"><button class="fit" onclick="addDeck()">Ajouter</button></div>
  ${ds.length ? ds.map(d => `<div class="card"><b>${esc(d.name)}</b><div class="mut">${d.cards} cartes · ${d.due} à réviser</div>
  <div class="row" style="margin-top:8px"><button onclick="review(${d.id})" ${d.due ? '' : 'disabled'}>Réviser</button><button class="sec" onclick="cards(${d.id},'${esc(d.name).replace(/'/g, "\\'")}')">Cartes</button>
  <button class="sec fit" onclick="renameDeck(${d.id})">Renommer</button><button class="sec fit" onclick="delDeck(${d.id})">Supprimer</button></div></div>`).join('') : '<p class="mut">Aucun paquet. Créez-en un pour ajouter vos premières cartes.</p>'}`
    }
    const guard = f => async (...a) => {try {await f(...a)} catch (e) {alert(e.message)} };
    const addDeck = guard(async () => {await api('/decks', 'POST', {name: $('#dn').value}); decks()});
    const renameDeck = guard(async id => {const n = prompt('Nouveau nom'); if (n) {await api('/decks/' + id, 'PUT', {name: n}); decks()} });
    const delDeck = guard(async id => {if (confirm('Supprimer ce paquet et ses cartes ?')) {await api('/decks/' + id, 'DELETE'); decks()} });

    const cards = guard(async (id, name) => {
      const cs = await api(`/decks/${id}/cards`);
      V.innerHTML = `<a class="link" onclick="decks()">‹ Paquets</a><h2>${esc(name)}</h2><div class="card">
  <textarea id="f" rows="2" placeholder="Question"></textarea><textarea id="b" rows="2" placeholder="Réponse"></textarea>
  <button onclick="addCard(${id},'${esc(name).replace(/'/g, "\\'")}')">Ajouter la carte</button></div>
  ${cs.map(c => `<div class="card"><b>${esc(c.front)}</b><div>${esc(c.back)}</div><div class="row" style="margin-top:6px"><span class="mut">Boîte ${c.box}/5</span>
  <button class="sec fit" onclick="editCard(${c.id},${id},'${esc(name).replace(/'/g, "\\'")}',${JSON.stringify(c.front).replace(/"/g, '&quot;')},${JSON.stringify(c.back).replace(/"/g, '&quot;')})">Modifier</button>
  <button class="sec fit" onclick="delCard(${c.id},${id},'${esc(name).replace(/'/g, "\\'")}')">Supprimer</button></div></div>`).join('')}`
    });
    const addCard = guard(async (id, n) => {await api(`/decks/${id}/cards`, 'POST', {front: $('#f').value, back: $('#b').value}); cards(id, n)});
    const editCard = guard(async (cid, id, n, f, b) => {const nf = prompt('Question', f); if (nf === null) return; const nb = prompt('Réponse', b); if (nb === null) return; await api('/cards/' + cid, 'PUT', {front: nf, back: nb}); cards(id, n)});
    const delCard = guard(async (cid, id, n) => {await api('/cards/' + cid, 'DELETE'); cards(id, n)});

    let q = [], i = 0, good = 0;
    const review = guard(async id => {q = await api(`/decks/${id}/review`); i = 0; good = 0; step()});
    function step() {
      if (i >= q.length) {V.innerHTML = `<div class="card big">Session terminée<br>${good} / ${q.length} sues</div><button onclick="decks()">Retour aux paquets</button>`; return }
      const c = q[i]; V.innerHTML = `<p class="mut">Carte ${i + 1} sur ${q.length} · boîte ${c.box}/5</p><div class="card big">${esc(c.front)}</div><button id="sh" style="width:100%" onclick="reveal()">Voir la réponse</button>`
    }
    function reveal() {
      const c = q[i]; V.innerHTML = `<p class="mut">Carte ${i + 1} sur ${q.length}</p><div class="card big"><b>${esc(c.front)}</b><hr style="width:100%;border:0;border-top:1px solid var(--line)">${esc(c.back)}</div>
  <div class="row"><button class="ko" onclick="answer(false)">Je ne savais pas</button><button class="ok" onclick="answer(true)">Je savais</button></div>`}
    const answer = guard(async ok => {await api(`/cards/${q[i].id}/review`, 'POST', {correct: ok}); if (ok) good++; i++; step()});

    const statsView = guard(async () => {
      const s = await api('/stats');
      V.innerHTML = `<a class="link" onclick="decks()">‹ Paquets</a><h2>Statistiques</h2><div class="grid">
  <div class="card"><div class="stat">${s.reviews_total}</div><span class="mut">révisions au total</span></div>
  <div class="card"><div class="stat">${s.success_rate} %</div><span class="mut">de réussite</span></div>
  <div class="card"><div class="stat">${s.reviews_today}</div><span class="mut">aujourd'hui</span></div>
  <div class="card"><div class="stat">${s.streak_days} j</div><span class="mut">jours consécutifs</span></div></div>
  <h2>Cartes par boîte</h2><div class="card">${Object.entries(s.boxes).map(([k, n]) => `<div class="row"><span class="fit" style="width:70px">Boîte ${k}</span><div style="background:var(--hl);height:10px;border-radius:5px;flex:none;width:${Math.min(n * 10, 100)}%;min-width:4px"></div><span class="fit mut">${n}</span></div>`).join('')}</div>`
    });

    token ? decks().catch(authView) : authView();
  </script>
</body>

</html>
